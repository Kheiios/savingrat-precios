name: Actualizar precios

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días a las 06:17 (hora de Chile, aprox.)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo prueba (3 productos por súper, con capturas para revisar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar precios
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            python scraper/buscar.py --prueba
          else
            rm -rf data/debug
            python scraper/buscar.py
          fi

      - name: Guardar resultados
        run: |
          git config user.name "savingrat-precios"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
